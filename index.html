<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Futsal Team Manager</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Team Utility</p>
          <h1>Futsal Player Rating & Team Splitter</h1>
        </div>
        <button id="splitTeamsBtn" class="btn btn-primary">Split Teams</button>
      </header>

      <section class="panel form-panel">
        <h2>Add Player</h2>
        <form id="addPlayerForm" novalidate>
          <div class="form-grid">
            <label>
              Name
              <input type="text" id="name" name="name" maxlength="30" required />
            </label>

            <label>
              Position
              <select id="position" name="position" required>
                <option value="ATT">ATT</option>
                <option value="MID">MID</option>
                <option value="DEF">DEF</option>
              </select>
            </label>

            <label>
              Image URL
              <input
                type="url"
                id="imageUrl"
                name="imageUrl"
                placeholder="https://example.com/player.jpg"
              />
            </label>

            <label>
              PAC
              <input type="number" id="pac" name="pac" min="0" max="100" step="1" required />
            </label>
            <label>
              SHO
              <input type="number" id="sho" name="sho" min="0" max="100" step="1" required />
            </label>
            <label>
              PAS
              <input type="number" id="pas" name="pas" min="0" max="100" step="1" required />
            </label>
            <label>
              DRI
              <input type="number" id="dri" name="dri" min="0" max="100" step="1" required />
            </label>
            <label>
              DEF
              <input type="number" id="def" name="def" min="0" max="100" step="1" required />
            </label>
            <label>
              PHY
              <input type="number" id="phy" name="phy" min="0" max="100" step="1" required />
            </label>
          </div>

          <div class="form-actions">
            <p id="formMessage" aria-live="polite"></p>
            <button type="submit" class="btn">Add Player</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>Players</h2>
          <p>Click cards to select players for team splitting</p>
        </div>
        <div id="playerGrid" class="player-grid" aria-live="polite"></div>
      </section>

      <section class="panel teams-panel">
        <h2>Split Result</h2>
        <div class="teams-grid">
          <div class="team-box" id="teamABox">
            <h3>Team A</h3>
            <ul id="teamAList"></ul>
          </div>
          <div class="team-box" id="teamBBox">
            <h3>Team B</h3>
            <ul id="teamBList"></ul>
          </div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
